<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <title>Реквизиты — Карта воспоминаний</title>
    <style>
      :root {
        --paper: #f5efe3;
        --card: #fffaf1;
        --ink: #33261c;
        --ink-soft: #7a6a58;
        --terra: #c25932;
        --line: rgba(58, 40, 25, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, 'Times New Roman', serif;
        background: var(--paper);
        color: var(--ink);
        padding: 32px 20px 48px;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(58, 40, 25, 0.16);
        padding: 36px 28px 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 600;
      }
      .eyebrow {
        margin: 0 0 24px;
        color: var(--terra);
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p.lead {
        margin: 0 0 28px;
        color: var(--ink-soft);
        line-height: 1.5;
        font-size: 16px;
      }
      dl {
        margin: 0;
      }
      dt {
        margin: 0 0 4px;
        color: var(--ink-soft);
        font-size: 13px;
      }
      dd {
        margin: 0 0 18px;
        font-size: 18px;
        line-height: 1.4;
        user-select: text;
      }
      a { color: var(--terra); }
      .inn {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Карта воспоминаний</p>
      <h1>Реквизиты</h1>
      <p class="lead">
        Платежи принимает самозанятый. На этой странице указан ИНН получателя оплаты.
      </p>
      <dl>
        <dt>ФИО</dt>
        <dd>Галиев Алексей Юрьевич</dd>
        <dt>Статус</dt>
        <dd>Самозанятый (налог на профессиональный доход)</dd>
        <dt>ИНН</dt>
        <dd class="inn">345947188258</dd>
        <dt>Электронная почта</dt>
        <dd><a href="mailto:galievalexeygaliev@yandex.com">galievalexeygaliev@yandex.com</a></dd>
        <dt>Телефон</dt>
        <dd><a href="tel:+79963688158">+7 996 368-81-58</a></dd>
      </dl>
    </main>
  </body>
</html>
